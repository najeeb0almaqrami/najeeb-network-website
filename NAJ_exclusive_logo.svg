<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Diamond Shape Base -->
  <path d="M256 40 L450 200 L256 470 L62 200 Z" fill="none" stroke="url(#goldGradient)" stroke-width="4" filter="url(#glow)"/>
  <!-- Abstract Geometric 'N' inside Diamond -->
  <path d="M180 320 L180 160 L240 160 L330 320 L330 160" fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Inner Facets for Diamond Look -->
  <path d="M256 40 L256 470 M62 200 L450 200 M150 115 L362 115 M150 285 L362 285" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
</svg>
